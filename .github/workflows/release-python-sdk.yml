name: Release Python SDK

on:
  push:
    tags:
      - "python-sdk-v*"

permissions: {}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches SDK version and tagged commit
        id: sdk-version
        env:
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git fetch origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "$EXPECTED_COMMIT"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main || {
            echo "::error::SDK release tag must target a commit already on main"
            exit 1
          }
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          tag_name = os.environ["TAG_NAME"]
          match = re.fullmatch(
              r"python-sdk-v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)",
              tag_name,
          )
          if match is None:
              raise SystemExit(f"Invalid Python SDK release tag: {tag_name}")

          package_project = tomllib.loads(
              Path("SDK/client/python/licenx/pyproject.toml").read_text(encoding="utf-8")
          )
          sdk_version = package_project["project"]["version"]
          if match.group(1) != sdk_version:
              raise SystemExit(
                  f"Tag version {match.group(1)} does not match licenx package version {sdk_version}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={sdk_version}\n")
          PY

  sdk-tests:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version:
          ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK test dependencies
        run: python -m pip install -r SDK/client/python/licenx/requirements.txt

      - name: Run SDK unit tests
        env:
          PYTHONPATH: SDK/client/python
        run: python -m unittest discover -s SDK/client/python/licenx/test -p 'test_*.py'

  release:
    needs: [validate-release, sdk-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out source commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build frontend
        run: python -m pip install --upgrade build

      - name: Build licenx wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist/licenx SDK/client/python/licenx

      - name: Create licenx artifact checksums
        run: |
          cd dist/licenx
          sha256sum licenx-*.whl licenx-*.tar.gz > licenx-SHA256SUMS

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Generate SDK archive
        run: npm run build:sdk-archive

      - name: Verify SDK archive parity
        run: npm run verify:sdk-archive

      - name: Generate SDK archive checksum
        run: |
          cd public
          sha256sum licenx-python-sdk.zip > licenx-python-sdk.zip.sha256

      - name: Create release and upload SDK archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          SDK_VERSION: ${{ needs.validate-release.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "$EXPECTED_COMMIT"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "Python SDK v${SDK_VERSION}" \
              --generate-notes
          fi

          gh release upload "$TAG_NAME" \
            public/licenx-python-sdk.zip \
            public/licenx-python-sdk.zip.sha256 \
            dist/licenx/licenx-*.whl \
            dist/licenx/licenx-*.tar.gz \
            dist/licenx/licenx-SHA256SUMS \
            --clobber

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          verification_dir="$RUNNER_TEMP/release-verification"
          mkdir -p "$verification_dir"
          gh release download "$TAG_NAME" \
            --pattern licenx-python-sdk.zip \
            --pattern licenx-python-sdk.zip.sha256 \
            --pattern 'licenx-*.whl' \
            --pattern 'licenx-*.tar.gz' \
            --pattern licenx-SHA256SUMS \
            --dir "$verification_dir"
          (
            cd "$verification_dir"
            sha256sum --check licenx-python-sdk.zip.sha256
            sha256sum --check licenx-SHA256SUMS
          )
          cmp public/licenx-python-sdk.zip "$verification_dir/licenx-python-sdk.zip"
          for artifact in dist/licenx/licenx-*.whl dist/licenx/licenx-*.tar.gz; do
            cmp "$artifact" "$verification_dir/$(basename "$artifact")"
          done

      - name: Verify PyPI distribution metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check dist/licenx/licenx-*.whl dist/licenx/licenx-*.tar.gz

      - name: Hand off exact validated distributions to isolated publisher
        uses: actions/upload-artifact@v4
        with:
          name: licenx-pypi-${{ needs.validate-release.outputs.version }}
          path: |
            dist/licenx/licenx-*.whl
            dist/licenx/licenx-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish verified licenx wheel and sdist to PyPI
    needs: [validate-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: licenx-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download only validated release distributions
        uses: actions/download-artifact@v4
        with:
          name: licenx-pypi-${{ needs.validate-release.outputs.version }}
          path: dist/

      - name: Validate expected artifact count and token availability
        shell: bash
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PYPI_TOKEN" || {
            echo "::error::PYPI_API_TOKEN secret is not configured"
            exit 1
          }
          test "$(find dist -maxdepth 1 -type f -name 'licenx-*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'licenx-*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          echo "PASS: exactly one licenx wheel and one source distribution"

      - name: Publish primary SDK to PyPI with repository secret
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: false
