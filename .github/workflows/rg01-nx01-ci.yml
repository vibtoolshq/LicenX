name: RG-01 NX-01 isolated candidate acceptance

# Intentionally limited to the reviewed candidate branch.
# No production credentials, SSH, deployment, release, tags or PyPI publishing.
on:
  push:
    branches:
      - rg01/nx01-release-candidate

permissions:
  contents: read

concurrency:
  group: rg01-nx01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-candidate:
    if: github.repository == 'vibtoolshq/LicenX'
    name: Focused Node/Python/SDK ZIP acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Install existing Python SDK test requirements
        run: python -m pip install -r SDK/client/python/licenx/requirements.txt

      - name: TypeScript static verification
        run: npm run lint

      - name: Focused Public Tools UI regression
        run: node --import tsx --test tests/publicCatalogUi.test.ts

      - name: Focused Python SDK live-config and signed realtime tests
        env:
          PYTHONPATH: SDK/client/python
        run: |
          python -m unittest discover -s SDK/client/python/licenx/test -p 'test_live_config.py'
          python -m unittest discover -s SDK/client/python/licenx/test -p 'test_realtime.py'

      - name: Production build (regenerates ignored SDK ZIP)
        run: npm run build

      - name: Byte-for-byte SDK ZIP/source verification
        run: python tests/verify_sdk_archive.py

      - name: Candidate-only verification receipt
        run: |
          echo "RG-01 candidate SHA: ${GITHUB_SHA}"
          echo "Node, targeted Python SDK, and generated SDK ZIP parity: PASS"
          echo "Main/production/release/PyPI: NOT ACCESSED"
